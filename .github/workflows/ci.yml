name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: app-tauri

jobs:
  web-and-rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app-tauri/package-lock.json

      - name: Install frontend deps
        run: npm ci

      - name: TypeScript check
        run: npm run check:web

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (ram-core)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/target
          key: ${{ runner.os }}-ram-core-${{ hashFiles('app-tauri/Cargo.lock') }}

      - name: Rust core tests
        run: npm run test

      - name: Rust core check
        run: npm run check:rust

  rust-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            app-tauri/target
          key: ${{ runner.os }}-ram-core-${{ hashFiles('app-tauri/Cargo.lock') }}

      - name: Rust core tests (Windows APIs)
        run: cargo test -p ram-core

  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install deps
        run: npm install

      - name: Doctor
        run: npm run doctor
