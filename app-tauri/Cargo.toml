[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "3.3.0"
edition = "2021"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
aes = "0.8"
ecb = "0.1"
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
